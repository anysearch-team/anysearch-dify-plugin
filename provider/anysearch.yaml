identity:
  author: anysearch-team
  name: anysearch
  label:
    en_US: AnySearch
    zh_Hans: AnySearch
  description:
    en_US: General web search through AnySearch.
    zh_Hans: 通过 AnySearch 进行通用网页搜索。
  icon: icon.png
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: Optional API Key
      zh_Hans: 可选 API Key
    placeholder:
      en_US: Leave empty for anonymous search
      zh_Hans: 留空使用匿名搜索
    help:
      en_US: Saving checks format only. The service checks access when searching; quota and fees are set by AnySearch.
      zh_Hans: 保存仅检查格式，搜索时由服务校验权限；额度和费用由 AnySearch 决定。
    url: https://www.anysearch.com
tools:
  - tools/search.yaml
  - tools/discover.yaml
  - tools/vertical_search.yaml
  - tools/extract.yaml
extra:
  python:
    source: provider/anysearch.py
